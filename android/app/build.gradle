plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------
// 签名配置
// 密钥库只存在于 GitHub Actions Secrets，不进仓库；CI 会在 android/ 下临时
// 生成 keystore.properties（已在 .gitignore 中排除），构建完即删除。
//
// ⚠️ 不要改用 System.getenv()：Gradle 配置阶段跑在 daemon 里，环境变量
//    未必是当前这次调用 export 的那份（实测导致签名配置被静默跳过，
//    产出 app-release-unsigned.apk）。属性文件是可靠做法。
// ---------------------------------------------------------------
def ksPropsFile = rootProject.file("keystore.properties")
def ksProps = new Properties()
def hasSigning = false
if (ksPropsFile.exists()) {
    ksPropsFile.withInputStream { ksProps.load(it) }
    def sf = ksProps.getProperty("storeFile")
    hasSigning = sf != null && file(sf).exists()
}

android {
    namespace 'com.zhoubianbeiji.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.zhoubianbeiji.app"
        minSdk 24
        targetSdk 34
        // 版本号跟随主版本：1.3.0 → 1 * 10000 + 3 * 100 + 0
        versionCode 10300
        versionName "1.3.0"
    }

    if (hasSigning) {
        signingConfigs {
            release {
                storeFile file(ksProps.getProperty("storeFile"))
                storeType "PKCS12"
                storePassword ksProps.getProperty("storePassword")
                keyAlias ksProps.getProperty("keyAlias")
                keyPassword ksProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    // 采用最简原生 Activity 与 WebView，零沉重第三方库，极速启动
}
