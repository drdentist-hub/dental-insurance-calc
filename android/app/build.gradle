plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------
// 签名配置
// 密钥库只存在于 GitHub Actions Secrets（ANDROID_KEYSTORE_BASE64 等），不进仓库。
// CI 会把密钥库解码到临时文件并注入下面这些环境变量；
// 本地开发没有这些变量时不配置签名，assembleRelease 会产出未签名包（不可发布）。
// ---------------------------------------------------------------
def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
def hasSigning = ksPath != null && !ksPath.trim().isEmpty() && file(ksPath).exists()

android {
    namespace 'com.zhoubianbeiji.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.zhoubianbeiji.app"
        minSdk 24
        targetSdk 34
        // 版本号跟随主版本：1.3.0 → 1 * 10000 + 3 * 100 + 0
        versionCode 10300
        versionName "1.3.0"
    }

    if (hasSigning) {
        signingConfigs {
            release {
                storeFile file(ksPath)
                storeType "PKCS12"
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    // 采用最简原生 Activity 与 WebView，零沉重第三方库，极速启动
}
